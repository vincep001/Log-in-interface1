<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #111112 0%, #373737 100%);
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #000000;
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: #000000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #950404;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        .success-msg {
            color: #6a8073;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        .demo-info {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>USER LOGIN</h2>

        <div id="error" class="error-msg">Invalid username or password!</div>
        <div id="success" class="success-msg">Login successful!</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="demo-info">
            <strong>Try this out!</strong><br>
            Username: <code>vince</code><br>
            Password: <code>pogi123</code>
        </div>
    </div>

    <script>
        const VALID_USERNAME = "vince";
        const VALID_PASSWORD = "pogi123";

        const loginForm = document.getElementById("loginForm");
        const errorMsg = document.getElementById("error");
        const successMsg = document.getElementById("success");

        loginForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                successMsg.style.display = "block";
                loginForm.reset();
                setTimeout(() => {
                    alert("Welcome, " + username + "!");
                }, 100);
            } else {
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
